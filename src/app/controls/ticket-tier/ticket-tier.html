<div class="container">
    <mat-form-field appearance="outline" class="name">
        <mat-label>Tier name</mat-label>
        <input #label matInput autocomplete="off" [disabled]="disabled()" [errorStateMatcher]="tierNameMatcher"
            (input)="setTierName(label.value)" (blur)="onBlur('tierName')" />
            <mat-error>{{ shownIssues().tierName }}</mat-error>

    </mat-form-field>

    <mat-form-field appearance="outline" class="price">
        <mat-label>Price</mat-label>
        <input #price matInput type="number" min="0" step="0.01" inputmode="decimal" [disabled]="disabled()"
            [errorStateMatcher]="priceMatcher" (input)="setPrice(price.value)" (blur)="onBlur('price')" />
        <!-- <span matTextSuffix>{{ currency() }}</span> -->
        <mat-error>{{ shownIssues().price }}</mat-error>
    </mat-form-field>

    <button mat-icon-button type="button">
        <mat-icon>delete</mat-icon>
    </button>
</div>

<button mat-stroked-button type="button" class="add add-button">
    <mat-icon>add</mat-icon>
    Add ticket tier
</button>
