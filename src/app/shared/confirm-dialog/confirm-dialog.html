<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
    <p class="message">{{ data.message }}</p>
</mat-dialog-content>

<!-- Cancel comes first, so it gets the focus: pressing Enter by reflex doesn't confirm. -->
<mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false">
        {{ data.cancelLabel ?? 'Cancel' }}
    </button>
    <button mat-flat-button type="button" [class.danger]="data.tone === 'danger'" [mat-dialog-close]="true">
        {{ data.confirmLabel ?? 'Confirm' }}
    </button>
</mat-dialog-actions>
